# Mosquitto — hardened configuration (private broker, TLS + per-device ACLs).
#
# Files this expects next to it (see broker/README.md for how to generate):
#   passwords   created with: mosquitto_passwd -c passwords backend
#   acl         per-user topic rules (acl.example provided)
#   certs/server.crt, certs/server.key   TLS identity of the broker

listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# --- Development only -------------------------------------------------------
# Uncomment this plaintext listener for bench testing WITHOUT TLS.
# Never expose port 1883 outside a trusted network.
# listener 1883
# protocol mqtt
