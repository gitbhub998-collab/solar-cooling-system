# One-command local stack: MQTT broker (Mosquitto) + backend (+ optional Postgres)
#
#   docker compose up            -> broker + backend + SQLite storage
#   docker compose --profile pg up   -> same, but with PostgreSQL storage
#
# Dashboard then uses ws://localhost:8080/ws and http://localhost:8080

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["8883:8883"]
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/passwords:/mosquitto/config/passwords:ro
      - ./broker/acl:/mosquitto/config/acl:ro
      - ./broker/certs:/mosquitto/certs:ro

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      MQTT_URL: mqtts://mosquitto:8883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in your shell or a .env file}
      MQTT_CA: /run/secrets/ca.crt
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN in your shell or a .env file}
      COMMAND_KEY: ${COMMAND_KEY:?set COMMAND_KEY in your shell or a .env file}
      DATABASE_URL: sqlite:///app/data/solarcool.db
    volumes:
      - backend-data:/app/data
      - ./broker/certs/ca.crt:/run/secrets/ca.crt:ro
    depends_on: [mosquitto]

  postgres:
    image: postgres:16-alpine
    profiles: ["pg"]
    environment:
      POSTGRES_PASSWORD: solarcool
      POSTGRES_DB: solarcool
    volumes:
      - pg-data:/var/lib/postgresql/data

  backend-pg:
    build: ./backend
    profiles: ["pg"]
    ports: ["8080:8080"]
    environment:
      MQTT_URL: mqtts://mosquitto:8883
      MQTT_USERNAME: backend
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD in your shell or a .env file}
      MQTT_CA: /run/secrets/ca.crt
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?set OPERATOR_TOKEN in your shell or a .env file}
      COMMAND_KEY: ${COMMAND_KEY:?set COMMAND_KEY in your shell or a .env file}
      DATABASE_URL: postgres://postgres:solarcool@postgres:5432/solarcool
    volumes:
      - ./broker/certs/ca.crt:/run/secrets/ca.crt:ro
    depends_on: [mosquitto, postgres]

volumes:
  backend-data:
  pg-data:
